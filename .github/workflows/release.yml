# The release pipeline for 1.0 and everything after it: pushing a tag —
# v1.0.0 once the Stage 8½ gate in ROADMAP.md closes — builds the same
# locked release binary CI has been guarding, packs it into an AppImage
# and publishes that as the GitHub Release. The AppImage is what the
# application itself knows how to update: the gear's update check looks
# for the release asset named `-x86_64.AppImage` and swaps it over the
# running file, so a tarball would be a release the app cannot answer.
# Nothing here can be triggered by a pull request; the tag is the
# trigger, and the tag is a deliberate act.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build and publish (Linux x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only job that writes, and only its own release
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config squashfs-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      # linuxdeploy ships on a single rolling "continuous" channel — there
      # is no older tag to pin; this is the tool, freshly, at build time.
      - name: Fetch linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
      # The bundle is linuxdeploy's doing, not scripted by hand: it lays the
      # binary, the desktop entry and the icons into an AppDir, runs the
      # dependency check over the ELF (which leaves ALSA and the C library
      # to the host, where they belong), and emits the squashfs image
      # named `iCraftMusic-<version>-x86_64.AppImage` after the desktop
      # file — the name the in-app update check finds by its suffix.
      - name: Build AppImage
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          version="${VERSION#v}"
          # linuxdeploy and its appimagetool run from their own FUSE mount
          # (the runners have /dev/fuse): extract-and-run would resolve the
          # relative paths against the tool's temporary copy and bury the
          # output there too, so the job does the mount.
          #
          # Of the icon set, the two largest renditions go in. linuxdeploy
          # points the AppDir's own icon at the smaller of them, and that is
          # what `.DirIcon` becomes — the picture the desktop shows for the
          # file itself, a real 256px image rather than the 64px default it
          # would pick from the full set. Smaller sizes scale cleanly from
          # these two, and the installed tree under packaging/icons/ carries
          # the whole set for a desktop that installs the entry.
          LINUXDEPLOY_OUTPUT_VERSION="$version" VERSION="$version" ARCH=x86_64 \
            ./linuxdeploy-x86_64.AppImage \
              --appdir AppDir \
              -e target/release/musiccraft \
              -d packaging/musiccraft.desktop \
              -i packaging/icons/hicolor/256x256/apps/musiccraft.png \
              -i packaging/icons/hicolor/512x512/apps/musiccraft.png \
              --output appimage
      # Unpack what was built rather than run it: a release job has no
      # display to open, and the failure worth catching here is the empty
      # or half-populated image, which the payload list shows at once.
      - name: Check the image
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          "./iCraftMusic-${version}-x86_64.AppImage" --appimage-extract
          test -x squashfs-root/usr/bin/musiccraft
          test -f squashfs-root/musiccraft.desktop
          test -f squashfs-root/usr/share/icons/hicolor/256x256/apps/musiccraft.png
          # `.DirIcon` is what the desktop shows for the file itself; `-f`
          # follows the symlink, so one that dangles fails here too.
          test -f squashfs-root/.DirIcon
      - uses: softprops/action-gh-release@v2
        with:
          files: iCraftMusic-*.AppImage
          generate_release_notes: true
