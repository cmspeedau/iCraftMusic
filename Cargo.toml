[workspace]
resolver = "2"
members = ["crates/*"]

[package]
name = "icraftmusic"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A local-first desktop media library"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = "0.37"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "ogg", "vorbis", "aac", "isomp4"] }
playback = { path = "crates/playback" }

[dev-dependencies]
tempfile = "3"