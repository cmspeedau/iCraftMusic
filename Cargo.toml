[package]
name = "musiccraft"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
directories = "6"
eframe = "0.36"
egui = "0.36"
# Decoding the cover art the scanner caches for the album view. `eframe`
# already pulls the crate in, so the formats are the only real cost.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25"
# The folder chooser behind Settings → Library management's "Choose a folder…"
# button. Without default features it uses the desktop's own file dialog
# (xdg-desktop-portal on Linux) rather than linking GTK itself, so the only
# crate it adds to the tree is `pollster`.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
rodio = "0.23.0"
rusqlite = { version = "0.40", features = ["bundled"] }
# The release check reads a version and a URL out of GitHub's reply, so the
# version comparison is the same one Cargo itself makes (`semver`) and the
# reply is parsed rather than string-scanned (`serde_json`).
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The one request the application makes: a GET of the releases API, to say
# whether a newer build has been published. rustls rather than the system TLS,
# so a build needs no OpenSSL; gzip is left off because the reply is a few
# hundred bytes. See `src/update.rs`.
ureq = { version = "3", default-features = false, features = ["rustls"] }
walkdir = "2"

# A distributable binary rather than a development build: one binary to copy,
# with the symbol tables left out of it. `lto` and a single codegen unit are
# what make the difference worth having on a player that is started and left
# running; `debug` symbols are still available by building with
# `--profile release` and `RUSTFLAGS=-Cdebuginfo=1` when something needs
# attaching to.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
