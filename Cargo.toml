[package]
name = "musiccraft"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
directories = "6"
eframe = "0.36"
egui = "0.36"
lofty = "0.25"
rodio = "0.23.0"
rusqlite = { version = "0.40", features = ["bundled"] }
