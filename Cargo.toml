[package]
name = "musiccraft"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
directories = "6"
eframe = "0.36"
egui = "0.36"
# Decoding the cover art the scanner caches for the album view. `eframe`
# already pulls the crate in, so the formats are the only real cost.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25"
rodio = "0.23.0"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
