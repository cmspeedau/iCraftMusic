[package]
name = "musiccraft"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
directories = "6"
eframe = "0.36"
egui = "0.36"
# Decoding the cover art the scanner caches for the album view. `eframe`
# already pulls the crate in, so the formats are the only real cost.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25"
# The folder chooser behind Settings → Library management's "Choose a folder…"
# button. Without default features it uses the desktop's own file dialog
# (xdg-desktop-portal on Linux) rather than linking GTK itself, so the only
# crate it adds to the tree is `pollster`.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
rodio = "0.23.0"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

# A distributable binary rather than a development build: one binary to copy,
# with the symbol tables left out of it. `lto` and a single codegen unit are
# what make the difference worth having on a player that is started and left
# running; `debug` symbols are still available by building with
# `--profile release` and `RUSTFLAGS=-Cdebuginfo=1` when something needs
# attaching to.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
